[package]
name = "rp2040-zero-usb-uart"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rp2040-zero-usb-uart"
path = "src/main.rs"
test = false
bench = false
required-features = ["firmware"]

[features]
default = ["firmware"]
firmware = ["dep:embassy-rp", "dep:embassy-usb", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:smart-leds", "dep:cortex-m", "dep:cortex-m-rt", "dep:critical-section"]
activity-led = ["firmware"]

# This revision supplies buffered UART runtime framing changes and on-wire flush.
[dependencies]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true, features = ["rp2040", "critical-section-impl", "executor-thread", "time-driver", "boot2-generic-03h"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true, default-features = false }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "a404c7806196df0403b90fb6bef13c80dcee5f2b", optional = true }
smart-leds = { version = "0.4.0", optional = true }
cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7.5", optional = true }
critical-section = { version = "1.2.0", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
debug = 2
panic = "abort"
